version: "1.0"

server:
  host: "0.0.0.0"
  port: 8080

upstreams:
  - id: "bestaiprice-openai"
    name: "BestAIPrice Gateway (OpenAI)"
    protocol: "openai"
    base_url: "https://bestaiprice.com/gateway/v1"
    api_key: "${BESTAIPRICE_API_KEY}"
    timeout_seconds: 120
    models:
      - "gpt-4o"
      - "gpt-4o-mini"
      - "deepseek-v4-flash"
      - "deepseek-v4-pro"
      - "kimi-k2.7-code"

  - id: "bestaiprice-anthropic"
    name: "BestAIPrice Gateway (Claude)"
    protocol: "anthropic"
    base_url: "https://bestaiprice.com/gateway"
    api_key: "${BESTAIPRICE_API_KEY}"
    timeout_seconds: 180
    models:
      - "claude-sonnet-5"
      - "claude-opus-5"
      - "claude-haiku-5-5"

routes:
  - path: "/v1/chat/completions"
    upstream: "bestaiprice-openai"
    retry_count: 2
  - path: "/v1/messages"
    upstream: "bestaiprice-anthropic"
    retry_count: 2
